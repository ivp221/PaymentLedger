spring:
  application.name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari: { maximum-pool-size: 20 }
  jpa:
    hibernate.ddl-auto: validate        # Flyway owns the schema
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true  # strict JSON (spec 9.6)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer: { acks: all, properties: { enable.idempotence: true } }
    listener: { ack-mode: manual }
    consumer: { enable-auto-commit: false, auto-offset-reset: earliest }

app:
  outbox: { batch-size: 50, poll-interval-ms: 200 }
  idempotency: { ttl-hours: 48 }
  topics:
    transfer-posted: ledger.transfer.posted
    transfer-rejected: ledger.transfer.rejected
    transfer-reversed: ledger.transfer.reversed

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

springdoc:
  api-docs.path: /api-docs

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
