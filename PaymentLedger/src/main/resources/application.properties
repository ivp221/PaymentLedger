spring.application.name=PaymentLedger

# --- Database (overridden by SPRING_DATASOURCE_* env vars in Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentledger
spring.datasource.username=ledger
spring.datasource.password=ledger
# Fine for development. Use Flyway/Liquibase migrations for production.
spring.jpa.hibernate.ddl-auto=update

# --- Kafka (overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS in Docker) ---
spring.kafka.bootstrap-servers=localhost:29092
# Required because the listeners take an Acknowledgment parameter
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.auto-offset-reset=earliest

# --- Redis (overridden by SPRING_DATA_REDIS_* env vars in Docker) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- App settings (bound by @ConfigurationProperties and @KafkaListener) ---
app.payments.idempotency-ttl-hours=24
app.payments.submitted-topic=payments.submitted
app.payments.completed-topic=payments.completed
app.payments.failed-topic=payments.failed

app.outbox.batch-size=20
app.outbox.poll-interval-ms=100
